
services:
  spark-jupyter:
    image: jupyter/pyspark-notebook:latest
    container_name: spark-container
    ports:
      - "8889:8888"   # Jupyter Lab 웹 포트 (접속: http://localhost:8889)
      - "4045:4040"   # Spark Web UI 포트
    volumes:
      - .:/home/jovyan/work
    environment:
      - JUPYTER_ENABLE_LAB=yes
      - JUPYTER_TOKEN=spark123
      - SPARK_OPTS=--packages com.mysql:mysql-connector-j:8.3.0
    restart: always

  # 셀레니움을 완벽하게 돌려줄 크롬 전용 독채 컨테이너
  selenium-chrome:
    image: selenium/standalone-chrome:latest
    container_name: selenium-chrome
    ports:
      - "4444:4444"
    shm_size: 2g
    restart: always

  # 1. DB 초기화 (한 번 실행되고 자동 종료)
  airflow-init:
    image: apache/airflow:2.7.1
    environment:
      - AIRFLOW__CORE__EXECUTOR=SequentialExecutor
      - AIRFLOW__CORE__SQL_ALCHEMY_CONN=sqlite:////opt/airflow/airflow.db
      - _PIP_ADDITIONAL_REQUIREMENTS=apache-airflow-providers-apache-spark==4.1.3 selenium beautifulsoup4 pandas
    volumes:
      - ./airflow_project/dags:/opt/airflow/dags
      - ./shared:/opt/shared
      # 💡 로컬 airflow.db 파일 매핑은 완전히 제거하여 권한 꼬임 방지
    command: >
      bash -c "airflow db migrate &&
      airflow users create --username admin --firstname admin --lastname admin --role Admin --email admin@example.com --password admin || true"

  # 2. 실제 화면 + 스케줄러 가동 서비스
  airflow-webserver:
    image: apache/airflow:2.7.1
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      selenium-chrome:
        condition: service_started
    environment:
      - AIRFLOW__CORE__EXECUTOR=SequentialExecutor
      - AIRFLOW__CORE__SQL_ALCHEMY_CONN=sqlite:////opt/airflow/airflow.db
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - _PIP_ADDITIONAL_REQUIREMENTS=apache-airflow-providers-apache-spark==4.1.3 selenium beautifulsoup4 pandas
    ports:
      - "8080:8080"
    volumes:
      - ./airflow_project/dags:/opt/airflow/dags
      - ./shared:/opt/shared
    command: bash -c "airflow db migrate && airflow scheduler & airflow webserver"